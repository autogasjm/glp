<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catálogo Certificado - JM Autogas</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* --- VARIABLES BASE --- */
            --bg-deep: #000000; 
            --bg-gradient: none; 
            --text-main: #ffffff;
            --text-sec: #a3a3a3; 
            --card-bg: rgba(12, 12, 12, 0.7); 
            --card-border: rgba(255, 255, 255, 0.15);
            --card-shadow: 0 0 0 transparent; 
            --search-bg: rgba(5, 5, 5, 0.9);
            --pill-bg: rgba(255, 255, 255, 0.1);
            --desc-bg: rgba(255, 255, 255, 0.04);
            
            /* Color por defecto (Landirenzo Azul) */
            --accent: #0066cc;
            --accent-glow: rgba(0, 102, 204, 0.6);
        }

        /* --- MODO CLARO --- */
        [data-theme="light"] {
            --bg-deep: #f0f2f5;
            --bg-gradient: radial-gradient(circle at 50% 0%, #ffffff 0%, #e2e8f0 100%);
            --text-main: #0f172a;
            --text-sec: #64748b;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(0, 0, 0, 0.08);
            --card-shadow: 0 10px 25px rgba(0,0,0,0.06);
            --search-bg: rgba(255, 255, 255, 0.95);
            --pill-bg: rgba(0, 0, 0, 0.05);
            --desc-bg: rgba(241, 245, 249, 0.9);
        }

        /* --- COLORES DE MARCA --- */
        
        /* MODO LANDIRENZO (AZUL) */
        body.landi-mode {
            --accent: #0066cc; 
            --accent-glow: rgba(0, 102, 204, 0.6);
        }

        /* MODO PRINS (AMARILLO) */
        body.prins-mode {
            --accent: #FFCC00; 
            --accent-glow: rgba(255, 204, 0, 0.5);
        }
        [data-theme="light"] body.prins-mode { --accent: #eab308; }

        /* MODO VIALLE (ROJO) */
        body.vialle-mode {
            --accent: #dc2626; 
            --accent-glow: rgba(220, 38, 38, 0.6);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; transition: background-color 0.4s, color 0.4s, border-color 0.4s, box-shadow 0.4s, transform 0.2s; }
        body { font-family: 'Outfit', sans-serif; background-color: var(--bg-deep); background-image: var(--bg-gradient); color: var(--text-main); margin: 0; padding: 0; overflow-x: hidden; min-height: 100vh; position: relative; }

        /* ESTRELLAS */
        .stars-container { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1; pointer-events: none; transition: filter 0.5s ease; }
        [data-theme="light"] .stars-container { filter: invert(1) opacity(0.3); }
        .stars, .stars2 { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: transparent; }
        .stars { width: 2px; height: 2px; box-shadow: 140px 140px #FFF, 540px 340px #FFF, 340px 940px #FFF, 740px 240px #FFF, 840px 440px #FFF, 240px 540px #FFF, 140px 840px #FFF, 640px 640px #FFF; animation: animStar 60s linear infinite; }
        .stars2 { width: 3px; height: 3px; box-shadow: 400px 300px #FFF, 200px 900px #FFF, 800px 100px #FFF; animation: animStar 120s linear infinite; opacity: 0.7; }
        @keyframes animStar { from { transform: translateY(0px); } to { transform: translateY(-2000px); } }

        /* HEADER */
        header { text-align: center; padding: 3rem 1rem 1rem; position: relative; z-index: 10; }
        h1 { 
            font-weight: 800; font-size: 3rem; margin: 0; text-transform: uppercase; letter-spacing: -2px; line-height: 1.1; 
            background: linear-gradient(90deg, var(--accent) 0%, #ffffff 50%, var(--accent) 100%); 
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            animation: rgbFlow 3s linear infinite; filter: drop-shadow(0 0 20px var(--accent-glow)); 
        }
        @keyframes rgbFlow { to { background-position: 200% center; } }

        /* --- SELECTOR DE KIT --- */
        .kit-selector { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; position: relative; z-index: 100; padding: 0 10px; flex-wrap: wrap; }
        
        .kit-btn {
            border: 1px solid rgba(255,255,255,0.3); 
            color: #ffffff; 
            padding: 12px 20px; 
            border-radius: 16px; 
            cursor: pointer; 
            font-family: 'Outfit', sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            gap: 5px; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            flex: 1; 
            min-width: 110px; 
            max-width: 180px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-shadow: 0 1px 3px rgba(0,0,0,0.5); 
        }

        .kit-logo {
            height: 35px; width: auto; object-fit: contain; margin-bottom: 2px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); 
        }

        .kit-btn small { font-weight: 600; font-size: 0.7rem; opacity: 0.9; text-align: center; text-transform: uppercase; letter-spacing: 0.5px; }

        /* --- COLORES DE FONDO BOTONES --- */
        .kit-btn.landi { background: linear-gradient(135deg, #00264d 0%, #0066cc 100%); }
        .kit-btn.landi:hover, .kit-btn.landi.active { background: linear-gradient(135deg, #004080 0%, #3399ff 100%); box-shadow: 0 0 25px rgba(0, 102, 204, 0.8); transform: scale(1.05); border-color: #66b3ff; }

        .kit-btn.prins { background: linear-gradient(135deg, #001f3f 30%, #cca300 100%); }
        .kit-btn.prins:hover, .kit-btn.prins.active { background: linear-gradient(135deg, #003366 20%, #ffcc00 100%); box-shadow: 0 0 25px rgba(255, 204, 0, 0.6); transform: scale(1.05); border-color: #ffe066; }

        .kit-btn.vialle { background: linear-gradient(135deg, #660000 0%, #cc0000 100%); }
        .kit-btn.vialle:hover, .kit-btn.vialle.active { background: linear-gradient(135deg, #990000 0%, #ff3333 100%); box-shadow: 0 0 25px rgba(255, 51, 51, 0.6); transform: scale(1.05); border-color: #ff6666; }

        /* SEARCH BAR */
        .search-wrapper { position: sticky; top: 15px; z-index: 100; display: flex; justify-content: center; padding: 0 20px; }
        .search-capsule { background: var(--search-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 12px 25px; border-radius: 50px; display: flex; align-items: center; gap: 15px; box-shadow: var(--card-shadow); border: 1px solid var(--card-border); width: 100%; max-width: 700px; transition: all 0.3s; }
        .search-capsule:focus-within { border-color: var(--accent); box-shadow: 0 0 25px var(--accent-glow); }
        input { border: none; background: transparent; font-size: 16px; padding: 5px; flex-grow: 1; outline: none; color: var(--text-main); font-family: 'Outfit', sans-serif; }
        input::placeholder { color: var(--text-sec); opacity: 0.6; }
        select { border: none; background: transparent; border-left: 1px solid var(--text-sec); padding: 5px 20px; font-size: 16px; color: var(--accent); cursor: pointer; outline: none; font-family: 'Outfit', sans-serif; font-weight: 600; max-width: 150px; }
        select option { background: #000; color: #fff; }
        [data-theme="light"] select option { background: #fff; color: #000; }

        /* GRID */
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px 80px; position: relative; z-index: 5; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .empty-state { text-align: center; margin-top: 80px; color: var(--text-sec); display: block; animation: fadeIn 1s; padding: 0 20px; }
        .empty-icon { font-size: 5rem; opacity: 0.5; margin-bottom: 20px; filter: grayscale(1); }

        /* CARDS */
        .card { background: var(--card-bg); border-radius: 20px; overflow: hidden; border: 1px solid var(--card-border); backdrop-filter: blur(12px); display: flex; flex-direction: column; opacity: 0; animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; position: relative; box-shadow: var(--card-shadow); }
        .card::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); opacity: 0.7; }
        .card-header { padding: 20px 20px 5px 20px; }
        .brand-tag { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); margin-bottom: 5px; display: block; }
        .model-name { font-size: 1.4rem; font-weight: 700; line-height: 1.1; color: var(--text-main); letter-spacing: -0.5px; }
        .card-body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; gap: 15px; }
        .description-box { background: var(--desc-bg); padding: 12px; border-radius: 12px; font-size: 0.9rem; color: var(--text-sec); line-height: 1.5; border: 1px solid var(--pill-bg); }
        .tech-box { font-size: 0.9rem; color: var(--accent); font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .specs { display: flex; flex-wrap: wrap; gap: 6px; }
        .pill { background: var(--pill-bg); padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 5px; border: 1px solid var(--card-border); }
        
        .btn-whatsapp { 
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%); 
            color: white; text-decoration: none; padding: 14px; border-radius: 12px; font-weight: 800; 
            text-transform: uppercase; letter-spacing: 1px; text-align: center; display: flex; 
            align-items: center; justify-content: center; gap: 10px; margin-top: 10px; 
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.2); font-size: 0.95rem; 
        }
        .btn-whatsapp:active { transform: scale(0.98); }

        .footer-info { padding: 12px 20px; background: rgba(0,0,0,0.2); border-top: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-sec); }
        .copy-btn { background: transparent; border: none; padding: 5px; color: var(--text-sec); cursor: pointer; font-weight: 700; font-size: 0.75rem; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; z-index: 200; background: var(--search-bg); color: var(--text-main); border: 1px solid var(--card-border); width: 50px; height: 50px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; backdrop-filter: blur(10px); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { to { opacity: 1; } }

        @media(max-width: 600px) {
            h1 { font-size: 2rem; }
            header { padding-top: 4rem; }
            .search-capsule { flex-direction: column; border-radius: 20px; padding: 15px; align-items: stretch; gap: 10px; }
            .search-capsule span { display: none; }
            input { width: 100%; border-bottom: 1px solid var(--card-border); padding-bottom: 10px; text-align: center; }
            select { width: 100%; border-left: none; padding: 5px 0; text-align: center; text-align-last: center; max-width: none; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

    // --- VARIABLES DE ESTADO ---
    const grid = document.getElementById('grid');
    const emptyState = document.getElementById('emptyState');
    const emptyTitle = document.getElementById('emptyTitle');
    const emptyText = document.getElementById('emptyText');
    const search = document.getElementById('searchInput');
    const brandF = document.getElementById('brandFilter');
    const kitBtns = document.querySelectorAll('.kit-btn');
    
    let currentData = [];
    let itemsToShow = 20; 
    let activeKit = 'LANDIRENZO'; 

    // --- INICIALIZACIÓN ---
    (function init() {
        db.forEach(item => {
            item.searchStr = (item.m + " " + item.mod + " " + item.c).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        });
        
        search.addEventListener('input', () => { filter(); });
        brandF.addEventListener('change', () => { filter(); });
        
        setKit('LANDIRENZO');
    })();

    function setKit(kit) {
        activeKit = kit;
        document.body.classList.remove('landi-mode', 'prins-mode', 'vialle-mode');
        
        if(kit === 'PRINS') document.body.classList.add('prins-mode');
        else if(kit === 'VIALLE') document.body.classList.add('vialle-mode');
        else document.body.classList.add('landi-mode');

        kitBtns.forEach(btn => btn.classList.remove('active'));
        if(kit === 'LANDIRENZO') kitBtns[0].classList.add('active');
        else if(kit === 'PRINS') kitBtns[1].classList.add('active');
        else if(kit === 'VIALLE') kitBtns[2].classList.add('active');

        search.value = '';
        brandF.value = '';
        updateBrandFilter();
        
        grid.innerHTML = '';
        emptyState.style.display = 'block';
        emptyTitle.innerText = "Inicia tu búsqueda";
        emptyText.innerText = `Selecciona una marca o escribe el modelo para ver el catálogo ${kit}.`;
    }

    function updateBrandFilter() {
        const availableBrands = [...new Set(db.filter(i => i.k === activeKit).map(i => i.m.toUpperCase()))].sort();
        brandF.innerHTML = '<option value="">Todas las Marcas</option>';
        const fragment = document.createDocumentFragment();
        availableBrands.forEach(b => {
            const op = document.createElement('option');
            op.value = b; op.innerText = b;
            fragment.appendChild(op);
        });
        brandF.appendChild(fragment);
    }

    function filter() {
        const q = search.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        const b = brandF.value;
        itemsToShow = 20;

        if(q === "" && b === "") {
            grid.innerHTML = '';
            emptyState.style.display = 'block';
            emptyTitle.innerText = "Inicia tu búsqueda";
            emptyText.innerText = `Selecciona una marca o escribe el modelo para ver el catálogo ${activeKit}.`;
            return;
        }

        currentData = db.filter(item => {
            const matchKit = item.k === activeKit;
            const matchText = q === "" || item.searchStr.includes(q);
            const matchBrand = b === "" || item.m.toUpperCase() === b;
            return matchKit && matchText && matchBrand;
        });

        if(currentData.length === 0) {
            emptyState.style.display = 'block';
            emptyTitle.innerText = "Sin coincidencias";
            emptyText.innerText = "No encontramos ese modelo en la marca seleccionada.";
            grid.innerHTML = '';
        } else {
            emptyState.style.display = 'none';
            render();
        }
    }

    function render() {
        grid.innerHTML = '';
        const slice = currentData.slice(0, itemsToShow);
        const fragment = document.createDocumentFragment();

        slice.forEach((item, idx) => {
            const el = document.createElement('div');
            el.className = 'card';
            if(idx < 20) el.style.animationDelay = `${idx * 0.05}s`;
            
            const desc = `Motor <strong>${item.cil}L</strong>, caja <strong>${item.tr.toLowerCase()}</strong>.`;
            let tech = "Inyección Secuencial";
            if(item.k === 'PRINS') tech = "Inyección Directa / Alta Gama";
            if(item.k === 'VIALLE') tech = "Sistema de Inyección Líquida";

            const waLink = generateWhatsappLink(item);

            el.innerHTML = `
                <div class="card-header">
                    <span class="brand-tag">${item.m}</span>
                    <div class="model-name">${item.mod}</div>
                </div>
                <div class="card-body">
                    <div class="description-box">${desc}</div>
                    <div class="tech-box"><span>⚙️</span> ${tech}</div>
                    <div class="specs">
                        <div class="pill">📅 ${item.d}</div>
                        <div class="pill">🏷️ ${item.k}</div>
                        <div class="pill">🚘 ${item.t}</div>
                    </div>
                    <a href="${waLink}" target="_blank" class="btn-whatsapp">📅 Agendar Visita</a>
                </div>
                <div class="footer-info">
                    <span style="font-family:monospace; font-weight:bold;">${item.c}</span>
                    <button class="copy-btn" onclick="copy('${item.c}', this)">COPIAR</button>
                </div>
            `;
            fragment.appendChild(el);
        });

        grid.appendChild(fragment);

        if(currentData.length > itemsToShow) {
            const btnMore = document.createElement('button');
            btnMore.innerText = "⬇️ Ver más resultados";
            btnMore.style.cssText = "grid-column: 1/-1; padding: 15px; background: var(--pill-bg); color: var(--text-main); border: 1px solid var(--card-border); border-radius: 10px; cursor: pointer; margin-top: 20px; font-weight:bold;";
            btnMore.onclick = () => {
                itemsToShow += 20;
                render();
            };
            grid.appendChild(btnMore);
        }
    }

    function generateWhatsappLink(item) {
        const phone = "56962990269";
        const message = `Hola JM Autogas, me gustaría cotizar para: ${item.m} ${item.mod} (Cert: ${item.c} - Kit ${item.k}).`;
        return `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
    }

    function copy(text, btn) {
        navigator.clipboard.writeText(text);
        const original = btn.innerText;
        btn.innerText = "LISTO!";
        setTimeout(() => btn.innerText = original, 1500);
    }
